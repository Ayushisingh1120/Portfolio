<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a23" />
      <stop offset="50%" stop-color="#111836" />
      <stop offset="100%" stop-color="#050515" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#avatarBg)" rx="40" />

  <!-- Background Neural Grid & Constellations -->
  <g stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5">
    <line x1="50" y1="80" x2="120" y2="140" />
    <line x1="120" y1="140" x2="90" y2="240" />
    <line x1="320" y1="70" x2="280" y2="150" />
    <line x1="280" y1="150" x2="330" y2="220" />
    <line x1="120" y1="140" x2="280" y2="150" stroke-dasharray="4,4" opacity="0.4" />
  </g>
  <circle cx="50" cy="80" r="4" fill="#00d2ff" opacity="0.8" />
  <circle cx="120" cy="140" r="5" fill="#3b82f6" opacity="0.9" />
  <circle cx="90" cy="240" r="3" fill="#8b5cf6" opacity="0.7" />
  <circle cx="320" cy="70" r="4" fill="#00d2ff" opacity="0.8" />
  <circle cx="280" cy="150" r="5" fill="#8b5cf6" opacity="0.9" />
  <circle cx="330" cy="220" r="4" fill="#3b82f6" opacity="0.7" />

  <!-- Outer Ring Glow -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#aiGlow)" stroke-width="3" opacity="0.5" filter="url(#glow)" />
  <circle cx="200" cy="200" r="148" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Shoulders & Outfit -->
  <path d="M 100 370 C 110 300, 150 270, 200 270 C 250 270, 290 300, 300 370 Z" fill="url(#coatGrad)" stroke="#334155" stroke-width="2" />
  <!-- Tech Shirt Collar -->
  <polygon points="180,270 200,310 220,270" fill="#3b82f6" opacity="0.8" />
  <polygon points="190,270 200,295 210,270" fill="#ffffff" opacity="0.9" />

  <!-- Neck -->
  <rect x="185" y="215" width="30" height="60" fill="#fbcfe8" rx="5" />

  <!-- Hair Back -->
  <path d="M 130 160 C 120 240, 130 280, 150 300 C 140 250, 150 190, 150 160 Z" fill="url(#hairGrad)" />
  <path d="M 270 160 C 280 240, 270 280, 250 300 C 260 250, 250 190, 250 160 Z" fill="url(#hairGrad)" />

  <!-- Head / Face Shape -->
  <ellipse cx="200" cy="180" rx="52" ry="65" fill="#fde047" opacity="0.1" />
  <path d="M 152 170 C 152 230, 175 250, 200 250 C 225 250, 248 230, 248 170 C 248 120, 225 110, 200 110 C 175 110, 152 120, 152 170 Z" fill="#fcd34d" />

  <!-- Hair Style Front -->
  <path d="M 148 165 C 145 125, 170 95, 200 95 C 230 95, 255 125, 252 165 C 240 135, 220 125, 200 128 C 175 130, 158 145, 148 165 Z" fill="url(#hairGrad)" />

  <!-- Modern Tech Eyewear / Glasses (Holo / Cyber Style) -->
  <rect x="162" y="160" width="32" height="22" rx="6" fill="rgba(59, 130, 246, 0.25)" stroke="#60a5fa" stroke-width="2.5" />
  <rect x="206" y="160" width="32" height="22" rx="6" fill="rgba(59, 130, 246, 0.25)" stroke="#60a5fa" stroke-width="2.5" />
  <line x1="194" y1="171" x2="206" y2="171" stroke="#60a5fa" stroke-width="2.5" />
  <line x1="152" y1="168" x2="162" y2="170" stroke="#60a5fa" stroke-width="2" />
  <line x1="238" y1="170" x2="248" y2="168" stroke="#60a5fa" stroke-width="2" />
  <!-- Eyes -->
  <circle cx="178" cy="171" r="3.5" fill="#1e1b4b" />
  <circle cx="222" cy="171" r="3.5" fill="#1e1b4b" />
  <circle cx="179" cy="170" r="1" fill="#ffffff" />
  <circle cx="223" cy="170" r="1" fill="#ffffff" />

  <!-- Smile -->
  <path d="M 188 214 Q 200 224 212 214" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- AI Agent Hologram Badge Floating -->
  <g transform="translate(260, 280)">
    <rect width="90" height="32" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="url(#aiGlow)" stroke-width="2" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AI AGENT</text>
  </g>

  <!-- Subtle Initials AS Monogram Stamp -->
  <g transform="translate(45, 290)">
    <circle cx="20" cy="20" r="22" fill="rgba(15, 23, 42, 0.85)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="9" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">AS</text>
  </g>
</svg>
